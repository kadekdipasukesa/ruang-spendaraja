<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" width="100%" height="100%" className="w-full h-auto max-w-md mx-auto">
  <defs>
    <style>
      .grid-line { stroke: #cbd5e1; stroke-width: 2; }
      .grid-border { stroke: #334155; stroke-width: 3; fill: #ffffff; }
      .header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .cell-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
      .sub-text { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; fill: #ffffff; text-anchor: middle; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="250" y="28" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">
    Papan Permainan Robot Manual (5x5)
  </text>

  <!-- Grid Outer Border -->
  <rect x="70" y="50" width="400" height="400" class="grid-border" rx="6" />

  <!-- Vertical Grid Lines (5 columns, 80px each) -->
  <!-- Col A: 70-150, B: 150-230, C: 230-310, D: 310-390, E: 390-470 -->
  <line x1="150" y1="50" x2="150" y2="450" class="grid-line" />
  <line x1="230" y1="50" x2="230" y2="450" class="grid-line" />
  <line x1="310" y1="50" x2="310" y2="450" class="grid-line" />
  <line x1="390" y1="50" x2="390" y2="450" class="grid-line" />

  <!-- Horizontal Grid Lines (5 rows, 80px each) -->
  <!-- Row 5: 50-130, Row 4: 130-210, Row 3: 210-290, Row 2: 290-370, Row 1: 370-450 -->
  <line x1="70" y1="130" x2="470" y2="130" class="grid-line" />
  <line x1="70" y1="210" x2="470" y2="210" class="grid-line" />
  <line x1="70" y1="290" x2="470" y2="290" class="grid-line" />
  <line x1="70" y1="370" x2="470" y2="370" class="grid-line" />

  <!-- Row Labels (Left: 5 to 1) -->
  <text x="45" y="95" class="header-text">5</text>
  <text x="45" y="175" class="header-text">4</text>
  <text x="45" y="255" class="header-text">3</text>
  <text x="45" y="335" class="header-text">2</text>
  <text x="45" y="415" class="header-text">1</text>

  <!-- Column Labels (Bottom: A to E) -->
  <text x="110" y="480" class="header-text">A</text>
  <text x="190" y="480" class="header-text">B</text>
  <text x="270" y="480" class="header-text">C</text>
  <text x="350" y="480" class="header-text">D</text>
  <text x="430" y="480" class="header-text">E</text>

  <!-- PETAK A1: ROBOT (Atas) -->
  <!-- Center: x=110, y=410 -->
  <g transform="translate(76, 376)" filter="url(#shadow)">
    <rect width="68" height="68" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
    <!-- Robot head -->
    <rect x="18" y="14" width="32" height="26" rx="4" fill="#ffffff" />
    <circle cx="27" cy="24" r="3.5" fill="#1e3a8a" />
    <circle cx="41" cy="24" r="3.5" fill="#1e3a8a" />
    <path d="M28 33 Q34 37 40 33" stroke="#1e3a8a" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Antenna with Arrow Up -->
    <line x1="34" y1="14" x2="34" y2="5" stroke="#ffffff" stroke-width="2.5" />
    <polygon points="34,2 29,8 39,8" fill="#facc15" stroke="#ca8a04" stroke-width="1" />
    <text x="34" y="52" class="cell-text" font-size="9">ROBOT</text>
    <text x="34" y="62" class="sub-text">(Atas ↑)</text>
  </g>

  <!-- PETAK A3: BATU -->
  <!-- Center: x=110, y=250 (Col A, Row 3: 70-150, 210-290) -->
  <g transform="translate(76, 216)" filter="url(#shadow)">
    <rect width="68" height="68" rx="8" fill="#64748b" stroke="#334155" stroke-width="2" />
    <!-- Stone Icon -->
    <polygon points="34,14 54,26 48,46 20,46 14,26" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5" />
    <text x="34" y="60" class="cell-text">BATU</text>
  </g>

  <!-- PETAK C1: BATU -->
  <!-- Center: x=270, y=410 (Col C, Row 1: 230-310, 370-450) -->
  <g transform="translate(236, 376)" filter="url(#shadow)">
    <rect width="68" height="68" rx="8" fill="#64748b" stroke="#334155" stroke-width="2" />
    <polygon points="34,14 54,26 48,46 20,46 14,26" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5" />
    <text x="34" y="60" class="cell-text">BATU</text>
  </g>

  <!-- PETAK C2: JERUK -->
  <!-- Center: x=270, y=330 (Col C, Row 2: 230-310, 290-370) -->
  <g transform="translate(236, 296)" filter="url(#shadow)">
    <rect width="68" height="68" rx="8" fill="#f97316" stroke="#c2410c" stroke-width="2" />
    <!-- Orange Fruit -->
    <circle cx="34" cy="27" r="14" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    <!-- Leaf -->
    <path d="M34 13 Q38 8 44 9 Q42 15 34 14" fill="#22c55e" />
    <text x="34" y="55" class="cell-text">JERUK</text>
    <text x="34" y="64" class="sub-text">(C2)</text>
  </g>

  <!-- PETAK C4: FINIS -->
  <!-- Center: x=270, y=170 (Col C, Row 4: 230-310, 130-210) -->
  <g transform="translate(236, 136)" filter="url(#shadow)">
    <rect width="68" height="68" rx="8" fill="#10b981" stroke="#047857" stroke-width="2" />
    <!-- Flagpole & Finish Chequered Flag -->
    <line x1="20" y1="12" x2="20" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <rect x="22" y="12" width="26" height="18" fill="#ffffff" stroke="#047857" stroke-width="1" />
    <!-- Chequer patterns -->
    <rect x="22" y="12" width="13" height="9" fill="#0f172a" />
    <rect x="35" y="21" width="13" height="9" fill="#0f172a" />
    <text x="34" y="54" class="cell-text">FINIS</text>
    <text x="34" y="64" class="sub-text">(C4)</text>
  </g>
</svg>

