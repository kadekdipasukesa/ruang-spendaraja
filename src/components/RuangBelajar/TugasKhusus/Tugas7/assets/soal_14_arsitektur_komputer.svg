<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="100%" height="100%" className="w-full h-auto max-w-lg mx-auto">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .box-title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .box-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #0284c7; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0284c7" />
    </marker>
    <marker id="arrowhead-start" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto">
      <polygon points="6 0, 0 3, 6 6" fill="#0284c7" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Title -->
  <text x="325" y="28" class="title">Arsitektur Dasar Sistem Komputer</text>

  <!-- Box [ P ] (Input Device) -->
  <g transform="translate(30, 60)" filter="url(#card-shadow)">
    <rect width="160" height="75" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <text x="80" y="34" class="box-title" fill="#0369a1">Bagian [ P ]</text>
    <text x="80" y="54" class="box-desc">(Input Device)</text>
  </g>

  <!-- Arrow: [ P ] -> Peranti Pemroses -->
  <line x1="195" y1="98" x2="235" y2="98" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Box Tengah: Peranti Pemroses (CPU & RAM) -->
  <g transform="translate(240, 60)" filter="url(#card-shadow)">
    <rect width="170" height="75" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
    <text x="85" y="34" class="box-title" fill="#047857">Peranti Pemroses</text>
    <text x="85" y="54" class="box-desc">(CPU &amp; Memori RAM)</text>
  </g>

  <!-- Arrow: Peranti Pemroses -> [ Q ] -->
  <line x1="415" y1="98" x2="455" y2="98" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Box [ Q ] (Output Device) -->
  <g transform="translate(460, 60)" filter="url(#card-shadow)">
    <rect width="160" height="75" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <text x="80" y="34" class="box-title" fill="#b45309">Bagian [ Q ]</text>
    <text x="80" y="54" class="box-desc">(Output Device)</text>
  </g>

  <!-- Bidirectional Arrow: Peranti Pemroses <-> Penyimpan Sekunder -->
  <line x1="325" y1="140" x2="325" y2="185" class="arrow" marker-start="url(#arrowhead-start)" marker-end="url(#arrowhead)" />

  <!-- Box Bawah: Penyimpan Sekunder (SSD / Harddisk) -->
  <g transform="translate(240, 190)" filter="url(#card-shadow)">
    <rect width="170" height="75" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <text x="85" y="34" class="box-title" fill="#334155">Penyimpan Sekunder</text>
    <text x="85" y="54" class="box-desc">(SSD / Harddisk)</text>
  </g>
</svg>

