<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%" className="w-full h-auto max-w-xl mx-auto">
  <defs>
    <style>
      .btn-label { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .group-label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #64748b; text-anchor: middle; }
      .tag-no { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #0284c7; text-anchor: middle; }
    </style>
    <filter id="ribbon-sh" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ribbon Container -->
  <g filter="url(#ribbon-sh)">
    <rect x="15" y="15" width="650" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- Divider between Group Font and Group Paragraph -->
  <line x1="320" y1="25" x2="320" y2="175" stroke="#e2e8f0" stroke-width="2" />

  <!-- === GROUP FONT (KIRI) === -->
  <!-- Dropdowns -->
  <g transform="translate(35, 30)">
    <!-- Font family dropdown -->
    <rect width="115" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="10" y="18" font-family="system-ui, sans-serif" font-size="12px" fill="#1e293b">Calibri</text>
    <path d="M98 11 L103 16 L108 11 Z" fill="#64748b" />

    <!-- Font size dropdown -->
    <rect x="125" width="55" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="135" y="18" font-family="system-ui, sans-serif" font-size="12px" fill="#1e293b">11</text>
    <path d="M165 11 L170 16 L175 11 Z" fill="#64748b" />
  </g>

  <!-- Font Buttons [1], [2], [3], [4] -->
  <!-- [1] Bold -->
  <g transform="translate(40, 72)">
    <rect width="42" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="21" y="27" class="btn-label" font-weight="900" font-size="18px">B</text>
    <text x="21" y="58" class="tag-no">[1]</text>
  </g>

  <!-- [2] Italic -->
  <g transform="translate(100, 72)">
    <rect width="42" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="21" y="27" class="btn-label" font-style="italic" font-family="Georgia, serif" font-size="18px">I</text>
    <text x="21" y="58" class="tag-no">[2]</text>
  </g>

  <!-- [3] Underline -->
  <g transform="translate(160, 72)">
    <rect width="42" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="21" y="25" class="btn-label" font-size="18px">U</text>
    <line x1="12" y1="29" x2="30" y2="29" stroke="#1e293b" stroke-width="2" />
    <text x="21" y="58" class="tag-no">[3]</text>
  </g>

  <!-- [4] Font Color -->
  <g transform="translate(220, 72)">
    <rect width="42" height="42" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
    <text x="21" y="25" class="btn-label" font-size="18px">A</text>
    <rect x="12" y="28" width="18" height="4" fill="#dc2626" rx="1" />
    <text x="21" y="58" class="tag-no">[4]</text>
  </g>

  <text x="150" y="165" class="group-label">Group: Font</text>

  <!-- === GROUP PARAGRAPH (KANAN) === -->
  <text x="490" y="45" font-family="system-ui, sans-serif" font-size="13px" font-weight="bold" fill="#334155" text-anchor="middle">
    Ikon Perataan Paragraf (Alignment)
  </text>

  <!-- [5] Align Left -->
  <g transform="translate(360, 68)">
    <rect width="45" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="8" y1="12" x2="37" y2="12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="19" x2="26" y2="19" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="26" x2="37" y2="26" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="33" x2="22" y2="33" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <text x="22" y="62" class="tag-no">[5]</text>
  </g>

  <!-- [6] Center -->
  <g transform="translate(430, 68)">
    <rect width="45" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="8" y1="12" x2="37" y2="12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="14" y1="19" x2="31" y2="19" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="26" x2="37" y2="26" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="33" x2="33" y2="33" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <text x="22" y="62" class="tag-no">[6]</text>
  </g>

  <!-- [7] Align Right -->
  <g transform="translate(500, 68)">
    <rect width="45" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="8" y1="12" x2="37" y2="12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="19" y1="19" x2="37" y2="19" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="26" x2="37" y2="26" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="23" y1="33" x2="37" y2="33" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <text x="22" y="62" class="tag-no">[7]</text>
  </g>

  <!-- [8] Justify -->
  <g transform="translate(570, 68)">
    <rect width="45" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="8" y1="12" x2="37" y2="12" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="19" x2="37" y2="19" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="26" x2="37" y2="26" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="8" y1="33" x2="37" y2="33" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
    <text x="22" y="62" class="tag-no">[8]</text>
  </g>

  <text x="490" y="165" class="group-label">Group: Paragraph</text>
</svg>

