<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="100%" height="100%" className="w-full h-auto max-w-xl mx-auto">
  <defs>
    <style>
      .comp-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .comp-num { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #0284c7; text-anchor: middle; }
      .inner-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
    </style>
    <filter id="hw-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- [ 1 ] Power Supply (PSU) -->
  <g transform="translate(20, 15)">
    <g filter="url(#hw-shadow)">
      <rect width="135" height="115" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2" />
      <!-- Fan grill circle -->
      <circle cx="67" cy="57" r="34" fill="#e2e8f0" stroke="#334155" stroke-width="2" />
      <line x1="67" y1="23" x2="67" y2="91" stroke="#334155" stroke-width="2" />
      <line x1="33" y1="57" x2="101" y2="57" stroke="#334155" stroke-width="2" />
      <circle cx="67" cy="57" r="8" fill="#475569" />
    </g>
    <text x="67" y="148" class="comp-label">Power Supply (PSU)</text>
    <text x="67" y="172" class="comp-num">[ 1 ]</text>
  </g>

  <!-- [ 2 ] Kartu Grafis (GPU) -->
  <g transform="translate(185, 15)">
    <g filter="url(#hw-shadow)">
      <rect width="145" height="115" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <!-- PCB and Dual Fans -->
      <rect x="12" y="22" width="121" height="70" rx="6" fill="#1e293b" />
      <circle cx="45" cy="57" r="22" fill="#38bdf8" opacity="0.8" />
      <circle cx="45" cy="57" r="7" fill="#0f172a" />
      <circle cx="100" cy="57" r="22" fill="#38bdf8" opacity="0.8" />
      <circle cx="100" cy="57" r="7" fill="#0f172a" />
    </g>
    <text x="72" y="148" class="comp-label">Kartu Grafis (GPU)</text>
    <text x="72" y="172" class="comp-num">[ 2 ]</text>
  </g>

  <!-- [ 3 ] Penyimpan SSD -->
  <g transform="translate(360, 15)">
    <g filter="url(#hw-shadow)">
      <rect width="135" height="115" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
      <!-- SSD Label plate -->
      <rect x="20" y="25" width="95" height="65" rx="4" fill="#3b82f6" />
      <text x="67" y="52" font-family="system-ui, sans-serif" font-size="12px" font-weight="bold" fill="#ffffff" text-anchor="middle">SSD 2.5"</text>
      <text x="67" y="70" font-family="system-ui, sans-serif" font-size="11px" fill="#dbeafe" text-anchor="middle">512 GB</text>
    </g>
    <text x="67" y="148" class="comp-label">Penyimpan SSD</text>
    <text x="67" y="172" class="comp-num">[ 3 ]</text>
  </g>

  <!-- [ 4 ] Processor (CPU) -->
  <g transform="translate(525, 15)">
    <g filter="url(#hw-shadow)">
      <rect width="135" height="115" rx="8" fill="#e2e8f0" stroke="#0284c7" stroke-width="2" />
      <!-- Heat spreader square -->
      <rect x="25" y="20" width="85" height="75" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
      <text x="67" y="52" font-family="system-ui, sans-serif" font-size="12px" font-weight="bold" fill="#0369a1" text-anchor="middle">CORE</text>
      <text x="67" y="70" font-family="system-ui, sans-serif" font-size="11px" font-weight="bold" fill="#1e293b" text-anchor="middle">CPU</text>
    </g>
    <text x="67" y="148" class="comp-label">Processor (CPU)</text>
    <text x="67" y="172" class="comp-num">[ 4 ]</text>
  </g>
</svg>

