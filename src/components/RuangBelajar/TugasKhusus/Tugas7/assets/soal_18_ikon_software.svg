<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%" className="w-full h-auto max-w-2xl mx-auto">
  <defs>
    <style>
      .app-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .app-no { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: bold; fill: #0284c7; text-anchor: middle; }
    </style>
    <filter id="icon-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- [1] MS Excel -->
  <g transform="translate(20, 20)">
    <g filter="url(#icon-shadow)">
      <rect width="115" height="95" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Excel Icon -->
      <rect x="35" y="15" width="45" height="42" rx="6" fill="#107c41" />
      <text x="57" y="44" font-family="system-ui, sans-serif" font-size="24px" font-weight="900" fill="#ffffff" text-anchor="middle">X</text>
    </g>
    <text x="57" y="135" class="app-title">MS Excel</text>
    <text x="57" y="155" class="app-no">Nomor [1]</text>
  </g>

  <!-- [2] Ubuntu Linux -->
  <g transform="translate(160, 20)">
    <g filter="url(#icon-shadow)">
      <rect width="115" height="95" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Ubuntu Circle -->
      <circle cx="57" cy="36" r="21" fill="#e95420" />
      <circle cx="57" cy="36" r="10" fill="#ffffff" />
      <circle cx="57" cy="36" r="5" fill="#e95420" />
    </g>
    <text x="57" y="135" class="app-title">Ubuntu Linux</text>
    <text x="57" y="155" class="app-no">Nomor [2]</text>
  </g>

  <!-- [3] Chrome -->
  <g transform="translate(300, 20)">
    <g filter="url(#icon-shadow)">
      <rect width="115" height="95" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Chrome Wheel -->
      <circle cx="57" cy="36" r="22" fill="#ea4335" />
      <circle cx="57" cy="36" r="15" fill="#fbbc05" />
      <circle cx="57" cy="36" r="10" fill="#4285f4" />
      <circle cx="57" cy="36" r="6" fill="#ffffff" />
    </g>
    <text x="57" y="135" class="app-title">Chrome</text>
    <text x="57" y="155" class="app-no">Nomor [3]</text>
  </g>

  <!-- [4] Android -->
  <g transform="translate(440, 20)">
    <g filter="url(#icon-shadow)">
      <rect width="115" height="95" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Android Bugdroid -->
      <path d="M42 36 A15 15 0 0 1 72 36 Z" fill="#3ddc84" />
      <circle cx="49" cy="30" r="1.5" fill="#ffffff" />
      <circle cx="65" cy="30" r="1.5" fill="#ffffff" />
      <line x1="47" y1="21" x2="43" y2="15" stroke="#3ddc84" stroke-width="2" stroke-linecap="round" />
      <line x1="67" y1="21" x2="71" y2="15" stroke="#3ddc84" stroke-width="2" stroke-linecap="round" />
      <rect x="42" y="39" width="30" height="20" rx="3" fill="#3ddc84" />
    </g>
    <text x="57" y="135" class="app-title">Android</text>
    <text x="57" y="155" class="app-no">Nomor [4]</text>
  </g>

  <!-- [5] Photoshop -->
  <g transform="translate(580, 20)">
    <g filter="url(#icon-shadow)">
      <rect width="115" height="95" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Photoshop Icon -->
      <rect x="35" y="15" width="45" height="42" rx="6" fill="#001e36" stroke="#31a8ff" stroke-width="1.5" />
      <text x="57" y="44" font-family="system-ui, sans-serif" font-size="20px" font-weight="900" fill="#31a8ff" text-anchor="middle">Ps</text>
    </g>
    <text x="57" y="135" class="app-title">Photoshop</text>
    <text x="57" y="155" class="app-no">Nomor [5]</text>
  </g>
</svg>

